# number of results kept by each in-memory cache (least recently used evicted), 0 to deactivate it. Override with
# the environment variables GRID_PROCESS__cache_size__<name>, set before importing grid_process
cache_size:
  nn_lookup: 10
  nn_lookup_regular: 10
  reproject_poi: 6
  reproject_grid: 6

# [m] max |N_LV95 - 1 200 000| of the destination for interpolating in LV95 when both grids are
# in lat/lon (otherwise ECEF). 700 km ≈ 0.6 % scale error, covers ICON-CH1/CH2 (523 km)
lv95_max_offset: 700000

data_model: # supported names
  grid:
    unstructured_dim: ["cell", "points"]
    y: ["y", "latitude", "lat"]
    x: ["x", "longitude", "lon"]
    surf_alt: ["surface_altitude", "HSURF", "altitude"]
  poi:
    dim: "poi" # dimension name given to point of interests after interpolation
    coord_from: "name" # geodataframe column to become coordinate labels
    alt_from: ["height_masl", "height", "altitude", "elevation"] # geodataframe column that represents altitude in meters
  validtime: ["time", "valid_time"]
  leadtime: ["lead_time", "step"]
  reftime: ["forecast_reference_time", "ref_time", "reftime"]
  ens_dim: ["realization", "eps", "epsd_1", "epsm", "number"]
